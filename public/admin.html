<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquiries — Sathish's Veni Beddings</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    main { max-width: 1000px; margin: 0 auto; padding: 2rem 16px; }
    form { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    form input { flex: 1; min-width: 200px; font: inherit; padding: .7rem .9rem; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
    .enq { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .enq h3 { margin: 0 0 .25rem; font-size: 1.1rem; }
    .enq p { margin: .25rem 0; }
    .thumbs { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
    .thumbs figure { margin: 0; text-align: center; font-size: .75rem; }
    .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo"><img src="/logo.svg" alt="" width="40" height="40"><span class="logo-text">Sathish's <b>Veni Beddings</b></span></a>
  </header>
  <main>
    <h2>Enquiries</h2>
    <form id="login">
      <input type="password" id="key" placeholder="Admin key" required aria-label="Admin key">
      <button class="btn">Show enquiries</button>
    </form>
    <p id="status" class="muted" role="status"></p>
    <div id="list"></div>
  </main>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const key = document.getElementById('key');
    try { key.value = sessionStorage.getItem('adminKey') || ''; } catch {}
    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status'), list = document.getElementById('list');
      const res = await fetch('/api/enquiries', { headers: { 'x-admin-key': key.value } });
      if (!res.ok) { status.textContent = res.status === 401 ? 'Wrong admin key.' : 'Could not load enquiries.'; list.innerHTML = ''; return; }
      try { sessionStorage.setItem('adminKey', key.value); } catch {}
      const items = (await res.json()).reverse();
      status.textContent = `${items.length} enquir${items.length === 1 ? 'y' : 'ies'}, newest first.`;
      list.innerHTML = items.map((q) => `
        <article class="enq">
          <h3>${esc(q.name)}</h3>
          <p><a href="tel:${esc(q.phone.replace(/\s/g, ''))}">${esc(q.phone)}</a> · <span class="muted">${new Date(q.createdAt).toLocaleString()}</span></p>
          ${q.message ? `<p>${esc(q.message)}</p>` : ''}
          ${q.products.length ? `<div class="thumbs">${q.products.map((i) => {
            const { code, qty } = typeof i === 'string' ? { code: i, qty: 1 } : i; // older enquiries stored plain codes
            return `<figure><img src="/images/profile-${esc(code)}.jpeg" alt=""><figcaption>${esc(code)} × ${esc(qty)}</figcaption></figure>`;
          }).join('')}</div>` : ''}
        </article>`).join('');
    });
  </script>
</body>
</html>
